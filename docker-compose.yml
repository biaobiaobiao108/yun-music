version: '3.8'

services:
  yun-yin:
    build: .
    container_name: yun-yin
    user: "0:0"
    restart: always
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    ports:
      - "9527:9527"
    volumes:
      # 数据目录：SQLite 数据库、账户、歌单快照、config.js 与日志
      - ./data:/server/data
      # 歌曲缓存目录。默认缓存根目录是 <工作目录>/cache，即容器内的 /server/cache，
      # 不在 /server/data 之下；未挂载时容器重建会丢失全部已缓存歌曲。
      - ./cache:/server/cache
      # 下载目录：仅下载模式下保存的音乐文件
      - ./music:/server/music
      # 封面缓存目录（可选，丢失后会自动从音频文件重新提取）
      - ./cover_cache:/server/cover_cache
    environment:
      # 环境变量配置，优先级高于 config.js
      - NODE_ENV=production
      # 必填：请在 .env 中设置强密码，禁止空密码启动
      - FRONTEND_PASSWORD=${FRONTEND_PASSWORD:?set FRONTEND_PASSWORD in .env}
      # 可选：首次初始化时创建用户，用户密码之后仅以 SQLite 哈希保存
      # - LX_USER_myuser=mypassword
