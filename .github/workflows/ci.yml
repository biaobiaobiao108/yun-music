name: CI Test and Build

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_and_build:
    name: Test, Typecheck and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache Bun install packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-1.4.2-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-1.4.2-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run tsc --noEmit

      - name: Build frontend assets
        run: bun run build:frontend

      - name: Check frontend assets
        run: bun run check:frontend-assets

      - name: Run unit tests
        run: bun test

      - name: Build production server bundle
        run: bun run build
