name: Build, Publish and Release Docker Image

on:
  push:
    tags:
      - 'v*' # 仅在推送版本标签（例如 v2.0.0, v2.0.1 等）时自动触发
  workflow_dispatch:
    inputs:
      publish_latest:
        description: '手动构建时是否将镜像更新为 latest'
        required: true
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, Publish and Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/yun-music" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && inputs.publish_latest == true || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push candidate image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: false
          cache-from: type=gha,scope=yun-music
          cache-to: type=gha,mode=max,scope=yun-music,ignore-error=true

      - name: Inspect multi-platform manifest
        run: docker buildx imagetools inspect "${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}"

      - name: Smoke test amd64 and arm64 images
        shell: bash
        env:
          CANDIDATE_IMAGE: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          container_name=yun-music-smoke-${GITHUB_RUN_ID}
          trap 'docker rm -fv "$container_name" >/dev/null 2>&1 || true' EXIT
          for platform in linux/amd64 linux/arm64; do
            docker run --detach --name "$container_name" --platform "$platform" --publish 127.0.0.1:9527:9527 --env "FRONTEND_PASSWORD=smoke-${GITHUB_RUN_ID}-${GITHUB_SHA:0:12}" "$CANDIDATE_IMAGE" >/dev/null
            ready=false
            for attempt in {1..45}; do
              if curl -fsS -o /dev/null --max-time 3 http://127.0.0.1:9527/ &&
                 curl -fsS -o /dev/null --max-time 3 http://127.0.0.1:9527/healthz &&
                 curl -fsS -o /dev/null --max-time 3 http://127.0.0.1:9527/readyz; then
                ready=true
                break
              fi
              echo "$platform attempt $attempt: waiting for readiness"
              sleep 2
            done
            if [[ "$ready" != true ]]; then
              docker logs "$container_name"
              exit 1
            fi
            docker logs "$container_name" 2>&1 | grep -F 'Starting 云鹿音乐 in production'
            docker rm -fv "$container_name" >/dev/null
          done

      - name: Promote verified digest to release tags
        shell: bash
        env:
          CANDIDATE_IMAGE: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tags=()
          while IFS= read -r tag; do
            [[ -z "$tag" ]] || tags+=(--tag "$tag")
          done <<< "$RELEASE_TAGS"
          docker buildx imagetools create "${tags[@]}" "$CANDIDATE_IMAGE"

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ### 🎵 云音 Web 播放器与管理后台 ${{ github.ref_name }}

            多架构极简全栈 Bun 容器镜像（`linux/amd64` + `linux/arm64`）已自动构建并推送到 GitHub Container Registry。

            #### 🐳 快速拉取与运行命令：
            ```bash
            # 拉取当前版本镜像
            docker pull ${{ steps.image.outputs.name }}:${{ github.ref_name }}

            # 启动容器 (数据持久化在 ./data)
            docker run -d \
              --name yun-music \
              --restart unless-stopped \
              -p 9527:9527 \
              -e FRONTEND_PASSWORD=replace-with-a-strong-random-password \
              -v $(pwd)/data:/server/data \
              ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ```
